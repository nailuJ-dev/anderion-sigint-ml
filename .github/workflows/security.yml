name: security

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No `cargo generate-lockfile`: the committed Cargo.lock is what ships, so
      # it is what must be audited. Regenerating it here would audit a resolution
      # that no artifact ever used.
      - name: Fail if Cargo.lock is missing or stale
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
