[package]
name = "anderion-sigint-ml"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Secure, sensor-agnostic machine-learning SDK for signal-observation classification, anomaly detection, open-set recognition, similarity, adaptation, and evaluation."
repository = "https://github.com/nailuJ-dev/anderion-sigint-ml"
readme = "README.md"
keywords = ["machine-learning", "signal", "embeddings", "anomaly-detection", "open-set"]
categories = ["science", "algorithms"]
publish = false

[features]
default = []
server = ["dep:axum", "dep:tokio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustfft = "~6.4.1"
sha2 = "0.10"
thiserror = "2"
axum = { version = "0.8", optional = true, features = ["json"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "anderion-sigint-serve"
path = "src/bin/serve.rs"
required-features = ["server"]

# Default release profile. `panic = "abort"` is deliberately NOT set here: the
# server binary must be able to turn a handler panic into a 5xx instead of
# taking the whole process down, and symbols are needed for post-mortem triage.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Size-optimised profile for edge/embedded targets that have no supervisor and
# no crash-reporting pipeline. Build with `cargo build --profile release-edge`.
[profile.release-edge]
inherits = "release"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = "warn"

[[example]]
name = "build_reference_bundle"
path = "examples/build_reference_bundle.rs"
required-features = ["server"]

[[bin]]
name = "sigint-golden-demo"
path = "src/bin/golden_demo.rs"
